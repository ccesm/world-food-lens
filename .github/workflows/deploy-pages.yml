name: Deploy Vite site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - name: Download official data (retain good cache on source failure)
        id: refresh
        continue-on-error: true
        run: npm run refresh-data
      - name: Report source failure
        if: steps.refresh.outcome == 'failure'
        run: echo "::warning::One or more sources failed. See refresh logs; retained values keep their original fetch times."
      - name: Refresh representative crop weather
        id: weather
        continue-on-error: true
        run: python3 scripts/refresh_weather.py
      - name: Report weather source failure
        if: steps.weather.outcome == 'failure'
        run: echo "::warning::Weather source failed for one or more points. Prior dates are retained and stale/error data are not interpreted as current."
      - name: Refresh NOAA ENSO outlook
        id: enso
        continue-on-error: true
        run: python3 scripts/refresh_enso.py
      - name: Report ENSO outlook failure
        if: steps.enso.outcome == 'failure'
        run: echo "::warning::NOAA ENSO outlook refresh failed. The last good issue date is retained and stale outlooks are not used for current crop watches."
      - run: npm test
      - run: npm run build
      - name: Save cache to the source-of-truth repository
        if: github.ref == 'refs/heads/main'
        run: |
          git add public/data/official-data.json public/data/local-weather.json public/data/enso-outlook.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Refresh official data cache'
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
