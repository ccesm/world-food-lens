name: G1 PSD structure audit (read-only)

# Manual, read-only audit of the USDA PSD bulk files. Records their structure
# as tests/fixtures/g1-psd-structure-audit.json and commits it to the branch it
# runs on. Refuses to run on main. No data release, Pages deployment, alert or
# email. First run: 2026-10-07 on claude/g1-0-supply-contract (run 37702352394).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python scripts/g1_psd_audit.py --output tests/fixtures/g1-psd-structure-audit.json
      - name: Commit the audit fixture to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/fixtures/g1-psd-structure-audit.json
          git diff --cached --quiet || git commit -m "Record G1 PSD structure audit fixture"
          git push origin "HEAD:${GITHUB_REF_NAME}"
